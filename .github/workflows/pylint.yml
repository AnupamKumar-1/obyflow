name: PyLint

on:
  pull_request:
    branches: [main]

jobs:
  pylint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/obyflow-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pip install pylint
      - run: pylint $(git ls-files '*.py')
