name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3
      - run: pnpm build
      - run: free -h
      - run: |
          sudo sysctl -w kernel.core_pattern="/tmp/core.%e.%p"
          ulimit -c unlimited
          NODE_OPTIONS="--report-on-fatalerror --report-uncaught-exception" pnpm exec turbo run test --concurrency=1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
        if: always()
      - run: |
          for f in /tmp/core.*; do
            [ -e "$f" ] || continue
            echo "=== analyzing $f ==="
            gdb -batch -ex "bt full" -ex "thread apply all bt" "$(command -v node)" "$f" 2>&1 || true
          done
        if: always()
      - run: sudo dmesg --time-format iso | tail -200 | tee /tmp/dmesg.log || true
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: crash-reports
          path: |
            **/report.*.json
            /tmp/core.*
            /tmp/dmesg.log
          if-no-files-found: ignore

  python:
    name: Python (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/obyflow-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
