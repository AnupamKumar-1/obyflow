name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  parity:
    name: Cross-SDK parity
    runs-on: ubuntu-latest
    container: node:24-bookworm

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: bash scripts/check-parity.sh

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - run: apt-get update -qq && apt-get install -y -qq python3 python3-pip build-essential sqlite3 libsqlite3-dev

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @obyflow/core --filter @obyflow/node --filter @obyflow/adapter-framework --filter @obyflow/adapter-vectordb run build

      - run: pnpm --filter @obyflow/core exec vitest run src/evidence/redact.conformance.test.ts src/http/trace-headers.conformance.test.ts

      - run: pnpm --filter @obyflow/node exec vitest run src/resource-attributes.conformance.test.ts

      - run: pip install --break-system-packages -e "python/obyflow-python[dev]"

      - run: pytest -q tests/test_redaction_conformance.py tests/test_resource_attributes_conformance.py tests/test_trace_headers_conformance.py
        working-directory: python/obyflow-python

  node:
    name: Node (build + test)
    runs-on: ubuntu-latest
    container: node:24-bookworm

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0

      - run: apt-get update -qq && apt-get install -y -qq python3 build-essential sqlite3 libsqlite3-dev

      - run: pnpm install --frozen-lockfile

      - run: |
          pnpm rebuild better-sqlite3
        env:
          npm_config_build_from_source: "false"

      - run: |
          node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.exec('CREATE TABLE t (a)'); db.prepare('INSERT INTO t VALUES (?)').run(1); console.log(db.prepare('SELECT * FROM t').all());"
        working-directory: packages/core

      - run: pnpm build

      - run: free -h

      - run: |
          sysctl -w kernel.core_pattern="/tmp/core.%e.%p" || true
          ulimit -c unlimited
          NODE_OPTIONS="--max-old-space-size=4096 --report-on-fatalerror --report-uncaught-exception" pnpm exec turbo run test --concurrency=1
        env:
          VITEST_POOL: "forks"
          VITEST_SINGLE_THREAD: "true"
          UV_THREADPOOL_SIZE: "64"

      - run: apt-get update -qq && apt-get install -y -qq gdb
        if: always()

      - run: |
          for f in /tmp/core.*; do
            [ -e "$f" ] || continue
            gdb -batch \
              -ex "bt full" \
              -ex "thread apply all bt" \
              "$(command -v node)" "$f" 2>&1 || true
          done
        if: always()

      - run: |
          dmesg --time-format iso 2>/dev/null | tail -200 | tee /tmp/dmesg.log || true
        if: always()

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: crash-reports
          path: |
            **/report.*.json
            /tmp/core.*
            /tmp/dmesg.log
          if-no-files-found: ignore

  python:
    name: Python (test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: python/obyflow-python

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      - run: pytest -q