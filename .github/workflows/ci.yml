name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: Node (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Run test tasks strictly one at a time. Each vitest run is already
      # pinned to a single fork, but running several packages' processes
      # simultaneously on GitHub's 2-vCPU runners still oversubscribes the
      # box and the OS kills a process outright with no catchable error
      # ("Worker exited unexpectedly", no stack trace) - a different
      # package each run. Fully serial execution removes that variable.
      - run: free -h
      - run: pnpm exec turbo run test --concurrency=1

  python:
    name: Python (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/obyflow-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"
      - run: pytest -q
